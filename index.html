:root {
  --black: #000;
  --fg: #f4f4f1;
  --dim: #9a9b97;
  --rule: rgba(244, 244, 241, .16);
  --accent: #ff9902;
  --sans: "Instrument Sans", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --pad: clamp(16px, 5vw, 64px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; min-height: 100svh; padding: 0 var(--pad); background: var(--black); color: var(--fg); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
header { height: 72px; border-bottom: 1px solid var(--rule); }
.wm { font: 600 18px/1 var(--sans); letter-spacing: -.02em; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px 0; }
h1 { margin: 0; font: 400 clamp(56px, 11vw, 168px)/1 var(--sans); letter-spacing: -.03em; text-transform: uppercase; }
h1 span { display: block; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: -.01em; font-size: 1.12em; padding: 0 .06em; }
/* the playhead: the app's orange running along a thin rule */
.track { position: relative; height: 1px; margin-top: 48px; background: var(--rule); overflow: visible; }
.track i { position: absolute; top: -8px; left: 0; width: 2px; height: 17px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 12px 1px var(--accent); animation: play 6s linear infinite; }
@keyframes play { from { left: 0; } to { left: calc(100% - 2px); } }
@media (prefers-reduced-motion: reduce) { .track i { animation: none; left: 33%; } }
footer { flex-wrap: wrap; min-height: 72px; padding: 14px 0; border-top: 1px solid var(--rule); font-size: 12px; color: var(--dim); }
footer nav { display: flex; flex-wrap: wrap; gap: 0 24px; }
footer a { display: inline-flex; align-items: center; min-height: 44px; color: var(--fg); text-decoration: none; }
footer a:hover { color: var(--accent); }
footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
